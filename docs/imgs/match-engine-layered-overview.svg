<svg width="100%" viewBox="0 0 680 570" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>撮合引擎分层架构总览</title>
  <desc>一套引擎服务现货+合约，Kafka 入站经 DisruptorTemplate 路由到 per-symbol RingBuffer，OrderEventHandler 单线程撮合，endOfBatch 批量输出，WAL+Snapshot 持久化。</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      :root {
        --bg: transparent;
        --title: #1a1a1a;
        --text: #444;
        --line: #999;
        --frame-bg: #f5f5f5; --frame-stroke: #888;
        --box-blue-bg: #e8f0fe;  --box-blue-stroke: #1a73e8; --box-blue-text: #174ea6;
        --box-green-bg: #e6f4ea;  --box-green-stroke: #137333;  --box-green-text: #0d652d;
        --box-green2-bg: #edf7e7; --box-green2-stroke: #4a7c29; --box-green2-text: #3a6220;
        --box-purple-bg: #f0edff; --box-purple-stroke: #5e35b1; --box-purple-text: #4527a0;
        --box-amber-bg: #fef7e0;  --box-amber-stroke: #b06000;  --box-amber-text: #8a4700;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --title: #e8eaed;
          --text: #9aa0a6;
          --line: #5f6368;
          --frame-bg: #2c2c2a; --frame-stroke: #5f5e5a;
          --box-blue-bg: #174ea6;  --box-blue-stroke: #8ab4f8; --box-blue-text: #d2e3fc;
          --box-green-bg: #0d652d;  --box-green-stroke: #81c995;  --box-green-text: #ceead6;
          --box-green2-bg: #3a6220; --box-green2-stroke: #a8d08d; --box-green2-text: #dcedc8;
          --box-purple-bg: #4527a0; --box-purple-stroke: #b39ddb; --box-purple-text: #d1c4e9;
          --box-amber-bg: #8a4700;  --box-amber-stroke: #fdd663;  --box-amber-text: #fef0c8;
        }
      }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .title { font-size: 15px; font-weight: 500; fill: var(--title); }
      .subtitle { font-size: 12px; font-weight: 400; fill: var(--text); }
      .hd { font-size: 13px; font-weight: 500; }
      .sub { font-size: 11px; font-weight: 400; fill: var(--text); }
      .cap { font-size: 11px; font-weight: 400; fill: var(--text); }
      .box-b { fill: var(--box-blue-bg); stroke: var(--box-blue-stroke); }
      .box-b .hd { fill: var(--box-blue-text); }
      .box-g { fill: var(--box-green-bg); stroke: var(--box-green-stroke); }
      .box-g .hd { fill: var(--box-green-text); }
      .box-g2 { fill: var(--box-green2-bg); stroke: var(--box-green2-stroke); }
      .box-g2 .hd { fill: var(--box-green2-text); }
      .box-p { fill: var(--box-purple-bg); stroke: var(--box-purple-stroke); }
      .box-p .hd { fill: var(--box-purple-text); }
      .box-a { fill: var(--box-amber-bg); stroke: var(--box-amber-stroke); }
      .box-a .hd { fill: var(--box-amber-text); }
      .frame { fill: var(--frame-bg); stroke: var(--frame-stroke); }
      .line { fill: none; stroke: var(--line); stroke-width: 1.5; marker-end: url(#arr); }
      .line-g { fill: none; stroke: var(--box-green-stroke); stroke-width: 1.5; marker-end: url(#arr); }
      .line-p { fill: none; stroke: var(--box-purple-stroke); stroke-width: 1.5; marker-end: url(#arr); }
      .line-a { fill: none; stroke: var(--box-amber-stroke); stroke-width: 1.5; marker-end: url(#arr); }
    </style>
  </defs>

  <text class="title" x="340" y="28" text-anchor="middle">撮合引擎分层架构总览 (ocx-match-engine)</text>
  <text class="subtitle" x="340" y="48" text-anchor="middle">一套引擎服务现货+合约 · per-symbol Disruptor · WAL+Snapshot 持久化</text>

  <rect x="240" y="64" width="200" height="44" rx="8" class="box-b" stroke-width="0.5"/>
  <text class="hd" x="340" y="80" text-anchor="middle" dominant-baseline="central">Kafka order_in.*</text>
  <text class="sub" x="340" y="97" text-anchor="middle" dominant-baseline="central">trade-order 入站</text>

  <path d="M340 108 L340 130" class="line"/>

  <rect x="180" y="130" width="320" height="48" rx="8" class="box-b" stroke-width="0.5"/>
  <text class="hd" x="340" y="146" text-anchor="middle" dominant-baseline="central">MessageConsumerListener</text>
  <text class="sub" x="340" y="164" text-anchor="middle" dominant-baseline="central">反序列化 + 参数校验 + 死信 DLT</text>

  <path d="M340 178 L340 200" class="line"/>

  <rect x="240" y="200" width="200" height="44" rx="8" class="box-b" stroke-width="0.5"/>
  <text class="hd" x="340" y="216" text-anchor="middle" dominant-baseline="central">DisruptorTemplate</text>
  <text class="sub" x="340" y="233" text-anchor="middle" dominant-baseline="central">按 symbol 路由到 RingBuffer</text>

  <path d="M340 244 L340 270" class="line-g"/>

  <rect x="40" y="270" width="600" height="130" rx="12" class="frame" stroke-width="0.5"/>
  <text class="hd" x="340" y="292" text-anchor="middle" dominant-baseline="central" fill="var(--title)">per-symbol Disruptor (RingBuffer · CPU亲和线程 · 单线程无锁)</text>

  <rect x="70" y="310" width="170" height="44" rx="8" class="box-g2" stroke-width="0.5"/>
  <text class="hd" x="155" y="326" text-anchor="middle" dominant-baseline="central">RingBuffer&lt;OrderEvent&gt;</text>
  <text class="sub" x="155" y="343" text-anchor="middle" dominant-baseline="central">YieldingWaitStrategy</text>

  <rect x="270" y="300" width="210" height="64" rx="8" class="box-g" stroke-width="0.5"/>
  <text class="hd" x="375" y="318" text-anchor="middle" dominant-baseline="central">OrderBooks</text>
  <text class="sub" x="375" y="334" text-anchor="middle" dominant-baseline="central">TreeMap bids/asks + MergeOrder</text>
  <text class="sub" x="375" y="350" text-anchor="middle" dominant-baseline="central">对象池 · 幂等500k · 冰山</text>

  <rect x="510" y="310" width="110" height="44" rx="8" class="box-g2" stroke-width="0.5"/>
  <text class="hd" x="565" y="326" text-anchor="middle" dominant-baseline="central">StopOrderMgr</text>
  <text class="sub" x="565" y="343" text-anchor="middle" dominant-baseline="central">5种条件单</text>

  <text class="cap" x="340" y="384" text-anchor="middle">WAL: Chronicle Queue (ORDER_CREATE/CANCEL/MATCH) · Snapshot: JSON 每5min</text>

  <path d="M340 400 L340 422" class="line-p"/>

  <rect x="150" y="422" width="380" height="48" rx="8" class="box-p" stroke-width="0.5"/>
  <text class="hd" x="340" y="438" text-anchor="middle" dominant-baseline="central">OrderEventHandler.onEvent</text>
  <text class="sub" x="340" y="456" text-anchor="middle" dominant-baseline="central">LIMIT / MARKET / 条件单触发 / 批量撤单 → MatchServiceFactory</text>

  <path d="M340 470 L340 492" class="line-a"/>

  <rect x="100" y="492" width="480" height="56" rx="8" class="box-a" stroke-width="0.5"/>
  <text class="hd" x="340" y="510" text-anchor="middle" dominant-baseline="central">endOfBatch 批量 flush</text>
  <text class="sub" x="340" y="527" text-anchor="middle" dominant-baseline="central">trades→Kafka · completed→Kafka(分片) · 深度增量→Kafka(每100批全量)</text>
  <text class="sub" x="340" y="541" text-anchor="middle" dominant-baseline="central">Outbox兜底 · MatchReconciler对账(倒挂/价格顺序) · KafkaHealthTracker</text>
</svg>
